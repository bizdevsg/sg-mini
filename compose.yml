services:
  app:
    image: get-sgb:prod
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 6969
    init: true
    ports:
      - "${APP_PORT:-6969}:6969"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - next_cache:/app/.next/cache
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6969/', { redirect: 'manual' }).then((res)=>process.exit(res.status < 500 ? 0 : 1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  next_cache:
