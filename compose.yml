  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
  NEXT_ALLOWED_ORIGINS: ${NEXT_ALLOWED_ORIGINS:-}
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
  DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-}

services:
  app:
    image: get-sgb:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *build-env
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - next_cache:/app/.next/cache
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then((res)=>process.exit(res.status < 500 ? 0 : 1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  next_cache:
