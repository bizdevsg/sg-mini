services:
  website:
    image: get-sgb-website:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: website
        NEXT_PUBLIC_CLIENT_SITE_URL: ${NEXT_PUBLIC_CLIENT_SITE_URL:-http://localhost:6970}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:6969}
        NEXT_PUBLIC_ENABLE_CLIENT_AREA: ${NEXT_PUBLIC_ENABLE_CLIENT_AREA:-true}
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 6969
      NEXT_PUBLIC_CLIENT_SITE_URL: ${NEXT_PUBLIC_CLIENT_SITE_URL:-http://localhost:6970}
    init: true
    ports:
      - "${APP_SITE_PORT:-6969}:6969"
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [sgb-internal]
    volumes:
      - website_next_cache:/app/apps/website/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6969/', { redirect: 'manual' }).then((res)=>process.exit(res.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  client-area:
    image: get-sgb-client-area:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: client-area
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_CLIENT_SITE_URL:-http://localhost:6970}
        NEXT_PUBLIC_ENABLE_CLIENT_AREA: "true"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 6969
      NEXT_PUBLIC_ENABLE_CLIENT_AREA: "true"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_CLIENT_SITE_URL:-http://localhost:6970}
    init: true
    ports:
      - "${APP_CLIENT_SITE_PORT:-6970}:6969"
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [sgb-internal]
    volumes:
      - client_area_next_cache:/app/apps/client-area/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6969/', { redirect: 'manual' }).then((res)=>process.exit(res.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [website, client-area]
    networks: [sgb-internal]
    ports:
      - "${NGINX_PORT:-8080}:80"

networks:
  sgb-internal:

volumes:
  website_next_cache:
  client_area_next_cache:
